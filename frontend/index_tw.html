<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手工編繩長度計算器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>🧶 手工編繩長度計算器</h1>
        <p class="subtitle">精準計算所需的線長，不再浪費每一根線</p>

        <div class="calculator-container">
            <!-- 輸入表單 -->
            <div class="form-section">
                <h2>📝 輸入資訊</h2>

                <!-- 手圈長度 -->
                <div class="form-group">
                    <label for="braceletLength">手圈/項鍊長度（公分）</label>
                    <input 
                        type="number" 
                        id="braceletLength" 
                        placeholder="例如：20" 
                        min="1" 
                        step="0.5"
                        value="20"
                    >
                </div>

                <!-- 編繩類型 -->
                <div class="form-group">
                    <label for="knotType">編繩類型</label>
                    <select id="knotType">
                        <option value="">請選擇編繩類型</option>
                        <option value="金剛結">金剛結 (10倍)</option>
                        <option value="蛇結">蛇結 (9倍)</option>
                        <option value="單向平結">單向平結 (10倍)</option>
                        <option value="雙向平結">雙向平結 (10倍)</option>
                        <option value="二股辮">二股辮 (2倍)</option>
                        <option value="四股辮">四股辮 (2倍)</option>
                        <option value="六股辮">六股辮 (2倍)</option>
                        <option value="八股辮">八股辮 (2倍)</option>
                        <option value="十股辮">十股辮 (2倍)</option>
                        <option value="雙鎖結">雙鎖結 (2倍)</option>
                        <option value="玉米結">玉米結 (10倍)</option>
                    </select>
                </div>

                <!-- 線型 -->
                <div class="form-group">
                    <label for="threadType">線型</label>
                    <select id="threadType">
                        <option value="">請選擇線型</option>
                        <option value="72號玉線">72號玉線 (標準)</option>
                        <option value="A線">A線 (較粗)</option>
                        <option value="B線">B線 (略粗)</option>
                        <option value="0.8mm">0.8mm (較細)</option>
                        <option value="1mm">1mm (標準)</option>
                        <option value="1.2mm">1.2mm (較粗)</option>
                    </select>
                </div>

                <!-- 是否為包心蛇結 -->
                <div class="form-group checkbox">
                    <input 
                        type="checkbox" 
                        id="isHeartSnake"
                    >
                    <label for="isHeartSnake">是否為包心蛇結（需要增加線長）</label>
                </div>

                <!-- 計算按鈕 -->
                <button id="calculateBtn" class="btn-calculate">📐 計算所需線長</button>
            </div>

            <!-- 結果顯示 -->
            <div class="result-section" id="resultSection" style="display: none;">
                <h2>📊 計算結果</h2>
                <div class="result-box">
                    <div class="result-item">
                        <span class="label">手圈長度：</span>
                        <span id="resultBracelet" class="value"></span> cm
                    </div>
                    <div class="result-item">
                        <span class="label">編繩類型：</span>
                        <span id="resultKnot" class="value"></span>
                    </div>
                    <div class="result-item">
                        <span class="label">線型：</span>
                        <span id="resultThread" class="value"></span>
                    </div>
                    <div class="divider"></div>
                    <div class="result-item">
                        <span class="label">基礎線長：</span>
                        <span id="resultBase" class="value"></span> cm
                    </div>
                    <div class="result-item highlight">
                        <span class="label">需要剪線長度：</span>
                        <span id="resultFinal" class="value"></span> cm
                    </div>
                    <div class="result-item highlight">
                        <span class="label">每條線長度：</span>
                        <span id="resultPerThread" class="value"></span> cm
                    </div>
                    <div class="divider"></div>
                    <div class="message-box">
                        <p id="resultMessage" class="message"></p>
                    </div>
                </div>

                <button id="resetBtn" class="btn-reset">🔄 重新計算</button>
            </div>

            <!-- 錯誤提示 -->
            <div id="errorMessage" class="error-message" style="display: none;"></div>
        </div>

        <!-- 幫助資訊 -->
        <div class="help-section">
            <h3>💡 使用說明</h3>
            <ul>
                <li>根據編繩類型和線型，自動計算所需線長</li>
                <li>結果已包含15-20公分的握持餘量</li>
                <li>如果線型與72號玉線不同，系統會自動調整計算</li>
                <li>包心蛇結會額外增加線長，便於包心操作</li>
            </ul>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
